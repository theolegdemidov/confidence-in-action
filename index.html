<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Oleg Demidov — Уверенность в действии</title>
<meta name="description" content="Олег Демидов — уверенность в действии. Бесплатный гайд «Уверенность под давлением»: как говорить ясно и действовать, когда внутри всё сжимается.">
<meta name="theme-color" content="#0f0f11">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,800;1,800;1,900&family=Playfair+Display:ital,wght@0,500;1,500&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0f0f11;--bg2:#17171a;--line:#2b2b30;--fg:#f4efe8;--mute:#a9a49d;--ac:#d9c3a0;--ink:#1a140d;--display:"Montserrat",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--serif:"Playfair Display",Georgia,serif;--body:"Onest","Segoe UI",system-ui,-apple-system,sans-serif;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font:400 17px/1.6 var(--body);min-height:100vh}
img{max-width:100%;height:auto;display:block}a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.col{max-width:720px}
/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(15,15,17,.9);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.bar{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
.logo{font:italic 500 27px/1 var(--serif);letter-spacing:-.01em;color:var(--ac);flex:none;white-space:nowrap}
nav.tabs{display:flex;gap:8px;margin-left:auto;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;min-height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font:600 13px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);background:transparent;transition:background .2s,color .2s,border-color .2s}
.tab.on{background:var(--ac);color:var(--ink);border-color:var(--ac)}
@media(hover:hover){.tab:not(.on):hover{color:var(--fg);border-color:var(--ac)}}
.tab:active:not(.on){background:rgba(255,255,255,.08)}
@media(max-width:700px){.bar{flex-wrap:wrap;gap:10px}nav.tabs{order:3;width:100%}}
/* hero */
.hero{padding:0 0 12px}
.hero-grid{display:grid;grid-template-columns:1fr}
.hero-p{order:-1;margin:0 -18px;position:relative;overflow:hidden}
.hero-p img{width:100%;aspect-ratio:1/.9;object-fit:cover;object-position:60% 28%;filter:grayscale(.1) contrast(1.04)}
.hero-p::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,var(--bg) 100%)}
.hero-t{position:relative;z-index:2;margin-top:0;padding-top:6px}.hero-p{z-index:1}
h1{font:800 clamp(1.9rem,9.4vw,3.9rem)/1 var(--display);text-transform:uppercase;letter-spacing:-.02em;margin-bottom:18px}
h1 span{display:block}h1 em{font:italic 500 1.04em var(--serif);color:var(--ac);text-transform:none;letter-spacing:0}
.lead{font:600 19px/1.4 var(--body);margin-bottom:8px}
.sub{color:var(--mute);margin-bottom:24px;max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:12px}
@media(min-width:900px){.hero{padding:48px 0 30px}.hero-grid{grid-template-columns:1fr 1fr;gap:20px;align-items:center}.hero-p{order:2;margin:0}.hero-p img{aspect-ratio:1/1.02;max-height:620px;-webkit-mask-image:linear-gradient(to right,transparent,#000 24%,#000 92%,transparent),linear-gradient(to bottom,#000 72%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 24%,#000 92%,transparent),linear-gradient(to bottom,#000 72%,transparent);mask-composite:intersect}.hero-p::after{display:none}h1{font-size:min(4.4vw,4.1rem)}}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 26px;border-radius:999px;border:1px solid var(--ac);background:var(--ac);color:var(--ink);font:600 15px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:filter .2s,transform .15s,background .2s}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
@media(hover:hover){.btn:hover{filter:brightness(1.08)}.btn.ghost:hover{border-color:var(--ac)}}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
/* sections */
section.s{padding:52px 0;border-top:1px solid var(--line)}
.tag{font:600 12px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--ac);margin-bottom:12px}
h2{font:italic 900 clamp(28px,6.4vw,42px)/1.05 var(--display);text-transform:uppercase;margin-bottom:12px;text-wrap:balance}
h2 span{color:var(--ac)}
.s .sub{margin-bottom:22px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:720px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}
.card{display:block;background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:22px}
a.card{transition:border-color .2s}
@media(hover:hover){a.card:hover{border-color:var(--ac)}}
.card small{display:block;color:var(--mute);letter-spacing:.1em;text-transform:uppercase;font-size:12px;margin-bottom:8px}
.card h3{font:italic 800 20px/1.15 var(--display);text-transform:uppercase;color:var(--ac);margin-bottom:8px;overflow-wrap:anywhere}
.card p{color:var(--mute);font-size:16px}
.src{display:block;margin-top:10px;font-size:13.5px;color:var(--mute);opacity:.85}
.st{display:inline-block;font:600 11.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px;color:var(--ac)}
.st.no{color:#e9a7a7}.st.mid{color:#e6cf98}
/* guide */
.guide{display:grid;gap:22px;align-items:center;padding:22px}
.guide img{width:min(58%,230px);margin:0 auto;border-radius:10px;box-shadow:0 16px 40px rgba(0,0,0,.5)}
.guide .btn{margin-top:18px}
@media(min-width:700px){.guide{grid-template-columns:220px 1fr;gap:32px;padding:28px}.guide img{width:100%}}
/* exercises */
details{border-bottom:1px solid var(--line);padding:16px 0}
details summary{cursor:pointer;list-style:none;display:flex;gap:14px;align-items:baseline;font:700 18px/1.3 var(--body)}
details summary::-webkit-details-marker{display:none}
details summary em{font:italic 800 15px var(--display);font-style:italic;color:var(--ac);flex:none;width:2em}
details summary::after{content:"+";margin-left:auto;color:var(--ac);font-size:24px;line-height:1}
details[open] summary::after{content:"–"}
.exb{padding:12px 0 4px 0}.exb p{color:var(--mute);margin-bottom:10px}
.exb ol{margin:8px 0 14px 1.2em}.exb li{margin-bottom:8px}
.ok{border-left:2px solid var(--ac);padding:2px 0 2px 14px;color:var(--mute);font-size:16px}
.ok b{display:block;font:600 12px/1 var(--body);letter-spacing:.14em;color:var(--ac);margin-bottom:6px}
ol.refs{margin:0 0 0 1.3em;color:var(--mute);font-size:14.5px}ol.refs li{margin-bottom:10px}
ol.refs a{color:var(--ac);text-decoration:underline;text-underline-offset:3px}
footer{border-top:1px solid var(--line);padding:28px 0 48px;color:var(--mute);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;align-items:center}
footer a{border-bottom:1px solid var(--line)}
.view{display:none}.view.act{display:block}
html.js .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}html.js .rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}html.js .rv{opacity:1;transform:none;transition:none}}
.err{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
/* shortcuts (v1) */
.short{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:760px){.short{grid-template-columns:1fr 1fr}}
.sc{position:relative;display:grid;grid-template-columns:34px 1fr;gap:4px 14px;align-items:start;padding:16px 38px 16px 16px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--bg2);transition:border-color .25s,box-shadow .25s,transform .15s}
.sc .ic{grid-row:1/4;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ac)}
.sc .ic svg{width:16px;height:16px}
.sc small{font:600 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sc h3{font:italic 800 14px/1.2 var(--display);text-transform:uppercase;color:var(--ac)}
.sc p{font-size:12.5px;line-height:1.45;color:var(--mute)}
.sc .ar{position:absolute;top:14px;right:14px;width:14px;height:14px;color:var(--mute);transition:color .25s,transform .25s}
.sc.key{border-color:rgba(217,195,160,.55);box-shadow:0 0 0 1px rgba(217,195,160,.08),0 8px 28px -14px rgba(217,195,160,.35)}
.sc .bd{position:absolute;top:-9px;left:56px;background:var(--ac);color:var(--ink);font:700 9px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:999px}
@media(hover:hover){.sc:hover{border-color:var(--ac);box-shadow:0 0 0 1px rgba(217,195,160,.25),0 10px 34px -10px rgba(217,195,160,.5)}.sc:hover .ar{color:var(--ac);transform:translate(2px,-2px)}}
.sc:active{transform:scale(.985);border-color:var(--ac);box-shadow:0 0 0 1px rgba(217,195,160,.3),0 8px 26px -8px rgba(217,195,160,.55)}
.laws{display:grid;gap:0;grid-template-columns:1fr}
@media(min-width:760px){.laws{grid-template-columns:1fr 1fr;column-gap:36px}}
.law{display:grid;grid-template-columns:30px 1fr;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.law b{grid-row:1/3;font:italic 800 12px/1.6 var(--display);color:var(--ac)}
.law h3{font:700 11px/1.4 var(--body);letter-spacing:.14em;text-transform:uppercase}
.law p{font:italic 500 14px/1.45 var(--serif);color:var(--mute)}
footer .soc{display:flex;flex-wrap:wrap;gap:6px 16px}
footer .fn{flex-basis:100%;font-size:12px;opacity:.75}
details.pn{border:1px solid var(--line);border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.035),rgba(255,255,255,0) 60%),var(--bg2);padding:0;margin-top:10px;transition:border-color .25s,box-shadow .25s}
details.pn summary{display:grid;grid-template-columns:34px 1fr 20px;gap:2px 14px;align-items:center;padding:16px;cursor:pointer;list-style:none;font:inherit}
details.pn summary::-webkit-details-marker{display:none}
details.pn summary::after{display:none}
details.pn .ic{grid-row:1/3;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ac)}
details.pn .ic svg{width:16px;height:16px}
details.pn small{font:600 9.5px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:block}
details.pn h3{font:italic 800 14px/1.2 var(--display);text-transform:uppercase;color:var(--ac)}
details.pn .ch{grid-row:1/3;grid-column:3;width:16px;height:16px;color:var(--ac);transition:transform .3s}
details.pn[open] .ch{transform:rotate(180deg)}
details.pn[open]{border-color:rgba(217,195,160,.55)}
details.pn .pb{padding:0 16px 8px}
@media(hover:hover){details.pn:hover{border-color:var(--ac);box-shadow:0 10px 34px -12px rgba(217,195,160,.45)}}
details.pn summary:active{background:rgba(217,195,160,.06)}
/* v2 scale */
.v2 .sc{padding:20px 46px 20px 20px;grid-template-columns:42px 1fr;gap:5px 16px;border-radius:16px}
.v2 .sc .ic,.v2 details.pn .ic{width:42px;height:42px}.v2 .sc .ic svg,.v2 details.pn .ic svg{width:19px;height:19px}
.v2 .sc small,.v2 details.pn small{font-size:11px}
.v2 .sc h3,.v2 details.pn h3{font-size:17px}
.v2 .sc p{font-size:14.5px}
.v2 .sc .bd{left:68px;font-size:10px;top:-10px}
.v2 details.pn summary{grid-template-columns:42px 1fr 22px;padding:20px;gap:5px 16px}
.v2 details.pn .pb{padding:0 20px 10px}
.v2 .law h3{font-size:12px}.v2 .law p{font-size:15.5px}
.short details.pn{grid-column:1/-1;margin-top:0}
/* v3 shortcuts */
.sc{align-items:center;overflow:visible}
.sc .ic{grid-row:1/3}
.sc h3{font-size:15px}
.sc.pd{background-image:radial-gradient(rgba(217,195,160,.16) 1px,transparent 1.2px),linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,0) 60%);background-size:14px 14px,auto;background-color:var(--bg2)}
.sc.ps{background-image:repeating-linear-gradient(115deg,rgba(217,195,160,.06) 0 1px,transparent 1px 13px),linear-gradient(160deg,rgba(255,255,255,.03),rgba(255,255,255,0) 60%);background-color:var(--bg2)}
.sc.key{border-color:rgba(217,195,160,.7);background:radial-gradient(120% 140% at 85% 0%,rgba(217,195,160,.20),rgba(217,195,160,0) 60%),linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,0) 60%),#1b1813;box-shadow:0 0 0 1px rgba(217,195,160,.18),0 0 26px -6px rgba(217,195,160,.42),0 18px 40px -22px rgba(217,195,160,.55)}
.sc.key .ic{border-color:rgba(217,195,160,.55);background:rgba(217,195,160,.08)}
.sc.key .ar{color:var(--ac)}
@media(hover:hover){.sc.key:hover{border-color:#ecd9b8;background:radial-gradient(120% 140% at 85% 0%,rgba(217,195,160,.32),rgba(217,195,160,0) 62%),linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,0) 60%),#211c15;box-shadow:0 0 0 1px rgba(236,217,184,.35),0 0 34px -4px rgba(217,195,160,.6),0 20px 44px -20px rgba(217,195,160,.7)}}
.sc.key:active{border-color:#ecd9b8;background:radial-gradient(120% 140% at 85% 0%,rgba(217,195,160,.34),rgba(217,195,160,0) 62%),linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,0) 60%),#241e16;box-shadow:0 0 0 1px rgba(236,217,184,.4),0 0 36px -2px rgba(217,195,160,.65)}
.short{gap:14px}
.v2 .sc{min-height:92px}.v2 .sc h3{font-size:18px}
.sc{min-height:68px}
/* minimal ~ 60-65% */
body{font-size:14px;line-height:1.55}
.wrap{max-width:900px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.bar{padding-top:8px;padding-bottom:8px;gap:12px}
.logo{font-size:19px}
nav.tabs{gap:6px}
.tab{min-height:26px;padding:0 11px;font-size:10px;letter-spacing:.07em}
h1{font-size:clamp(1.3rem,6vw,1.75rem);margin-bottom:12px}
.lead{font-size:14.5px;margin-bottom:6px}
.sub{font-size:13px;margin-bottom:16px}
.cta{gap:8px}
.btn{min-height:34px;padding:0 17px;font-size:10.5px;letter-spacing:.08em;gap:8px}
.hero-p{margin:0 -16px}
.hero-p img{aspect-ratio:1/.78}
@media(min-width:900px){.hero{padding:28px 0 18px}h1{font-size:2.15rem}.hero-p img{max-height:400px}}
section.s{padding:30px 0}
.tag{font-size:10px;margin-bottom:8px}
h2{font-size:clamp(17px,4.4vw,22px);margin-bottom:8px}
.s .sub{margin-bottom:14px}
.grid{gap:10px}
.card{padding:14px;border-radius:12px}
.card small{font-size:10px;margin-bottom:5px}
.card h3{font-size:14px;margin-bottom:5px}
.card p{font-size:13px}
.st{font-size:10px;margin-bottom:6px}
.src{font-size:12px}
.guide{padding:14px;gap:14px}
.guide img{width:min(40%,150px)}
@media(min-width:700px){.guide{grid-template-columns:150px 1fr;gap:22px;padding:18px}}
.guide .btn{margin-top:12px}
details{padding:11px 0}
details summary{font-size:14px;gap:10px}
details summary em{font-size:12px}
details summary::after{font-size:18px}
.exb p,.exb li{font-size:13px}.ok{font-size:13px}.ok b{font-size:10px}
ol.refs{font-size:12.5px}
footer{padding:20px 0 34px;font-size:12px}
footer .soc{display:flex;flex-wrap:wrap;gap:6px 14px}
footer .fn{flex-basis:100%;font-size:11px;opacity:.75}
</style>
</head>
<body class="v1">
<header class="top">
  <div class="wrap bar">
    <a class="logo" data-p="home" href="#home">Oleg Demidov</a>
  </div>
</header>
<section class="view" data-view="home">
  <main>
    <section class="hero">
      <div class="wrap hero-grid">
        <div class="hero-t">
          <h1><span>Уверенность</span><span><em>в действии</em></span></h1>
          <p class="lead">Сила не повышает голос.</p>
